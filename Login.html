<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="login.css">

</head>
<body>

<div class="container-fluid p-0">

<div class="row g-0 vh-100">

    <!-- Left Side -->

    <div class="col-lg-5 login-side">

        <div class="login-wrapper">

            <div class="logo-section">

                <i class="bi bi-mortarboard-fill logo-icon"></i>

                <h3>ExamPortal</h3>

                <p>Online Examination System</p>

            </div>

            <h1 class="welcome-text">
                Welcome Back 👋
            </h1>
            <p class="sub-text">
                Login to continue to your account
            </p>

            <form>

                <div class="mb-4">

                    <label class="form-label">
                        Username / Email
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter username or email">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input type="password"
                               id="password"
                               class="form-control"
                               placeholder="Enter password">

                        <span class="input-group-text">
                            <i class="bi bi-eye"
                               id="togglePassword"></i>
                        </span>

                    </div>

                </div>

                <div class="d-flex justify-content-between mb-4">

                    <div class="form-check">

                        <input class="form-check-input"
                               type="checkbox">

                        <label class="form-check-label">
                            Remember Me
                        </label>

                    </div>

                    <a href="#" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>

                <button class="btn btn-primary login-btn w-100">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </button>

            </form>

            <div class="signup-area">

                Don't have an account?

                <a href="#">
                    Sign Up
                </a>

            </div>

            <div class="copyright">

                © 2026 All Rights Reserved

            </div>

        </div>

    </div>

    <!-- Right Side -->

    <div class="col-lg-7 image-side">

        <div class="overlay">

            <div class="content">

                <h1>
                    Smart Exam.<br>
                    Bright Future.
                </h1>

                <div class="line"></div>

                <p>
                    Our platform makes examination
                    management simple, secure,
                    and efficient for everyone.
                </p>

            </div>

        </div>

    </div>

</div>

</div>

<script>

const togglePassword =
document.getElementById("togglePassword");

const password =
document.getElementById("password");

togglePassword.addEventListener("click", function(){

if(password.type === "password"){

password.type = "text";

this.classList.remove("bi-eye");

this.classList.add("bi-eye-slash");

}
else{

password.type = "password";

this.classList.remove("bi-eye-slash");

this.classList.add("bi-eye");

}

});

</script>

</body>
</html>
